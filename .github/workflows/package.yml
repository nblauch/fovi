name: Package boundaries

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training without FFCV
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]' pytest build twine
      - name: Verify imports and checkpoint compatibility on CPU
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('ffcv') is None"
          python -c "import torch; import cupy; import warp"
          python -m pytest -q tests/test_package_boundaries.py tests/test_model_loading.py tests/test_dinov3_checkpoint_compat.py tests/test_robustness_fixes.py tests/test_trainer_eval_only.py tests/test_release_version.py
      - name: Build and check distribution metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*.whl
      - name: Check release tag and merged source
        if: github.ref_type == 'tag'
        run: |
          python scripts/check_distribution.py dist/*.whl --release-tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check installed wheel outside the checkout
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" core
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" models
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" training-without-ffcv
      - uses: actions/upload-artifact@v4
        with:
          name: fovi-distributions
          path: dist/
          if-no-files-found: error
