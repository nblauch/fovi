name: CPU tests and package

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training without FFCV
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]' pytest opencv-python-headless build twine
      - name: Run CPU tests and verify imports
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('ffcv') is None"
          python -c "import torch; import cupy; import warp; assert not torch.cuda.is_available()"
          python -m pytest -q -ra --junitxml="$RUNNER_TEMP/fovi-cpu.xml"
      - name: Upload CPU test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fovi-cpu-test-results
          path: ${{ runner.temp }}/fovi-cpu.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Build and check distribution metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*.whl
      - name: Check release tag and merged source
        if: github.ref_type == 'tag'
        run: |
          python scripts/check_distribution.py dist/*.whl --release-tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check installed wheel outside the checkout
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" core
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" models
          python "$GITHUB_WORKSPACE/tests/test_package_boundaries.py" training-without-ffcv
      - uses: actions/upload-artifact@v4
        with:
          name: fovi-distributions
          path: dist/
          if-no-files-found: error
