name: Package boundaries

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training without FFCV
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[training]' pytest build
      - name: Verify imports and checkpoint compatibility on CPU
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('ffcv') is None"
          python -c "import torch; import cupy; import warp"
          python -m pytest -q tests/test_package_boundaries.py tests/test_model_loading.py tests/test_dinov3_checkpoint_compat.py tests/test_robustness_fixes.py
      - name: Build and check distribution metadata
        run: |
          python -m build --wheel
          python scripts/check_distribution.py dist/*.whl
