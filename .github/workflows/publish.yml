name: Publish to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/package.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fovi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fovi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
